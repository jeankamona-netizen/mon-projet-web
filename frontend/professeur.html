<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espace Professeur — Connexion | UML</title>
  <meta name="description" content="Connexion réservée au corps professoral de l'Université Méthodiste de Lubumbashi.">
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-brand">
        <img src="img/logo.png" alt="Logo UML" class="nav-logo">
        <div>
          <span class="brand-name">Université Méthodiste de Lubumbashi</span>
          <span class="brand-devise">Scientia, Sanctitas et Veritas</span>
        </div>
      </div>
      <a href="index.html" class="btn-retour">← Retour à l'accueil</a>
    </div>
  </nav>

  <!-- CONTENU PRINCIPAL -->
  <main class="login-main admin-login-main">
    <div class="login-box admin-box">
      <div class="tab-content active" style="padding:32px">

        <div class="admin-box-header">
          <div class="admin-box-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 10v6M2 10l10-5 10 5-10 5-10-5z"/><path d="M6 12v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/></svg>
          </div>
          <h2>Espace Professeur</h2>
          <p class="form-sous-titre" style="margin-bottom:0">Réservé au corps professoral de l'UML</p>
        </div>

        <p id="prof-erreur" class="admin-erreur" style="display:none"></p>

        <div class="form-group">
          <label for="prof-email">Email</label>
          <input type="email" id="prof-email" placeholder="prenom.nom@uml.ac.cd" autocomplete="username">
        </div>

        <div class="form-group">
          <label for="prof-pass">Mot de passe</label>
          <div class="input-password">
            <input type="password" id="prof-pass" placeholder="••••••••" autocomplete="current-password">
            <button type="button" class="toggle-pwd" onclick="toggleProfPassword()" aria-label="Afficher/masquer le mot de passe">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button class="btn-submit" onclick="connexionProfesseur()">Se connecter</button>

        <p class="admin-footer-note" style="text-align:center;margin-top:18px">
          Accès non activé ? Contactez l'administration de l'UML.
        </p>

      </div>
    </div>
  </main>

  <!-- TOAST -->
  <div id="toast" class="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/professeur.js"></script>
</body>
</html>
