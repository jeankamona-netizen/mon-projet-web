<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration — Connexion | UML</title>
  <meta name="description" content="Connexion réservée au personnel administratif de l'Université Méthodiste de Lubumbashi.">
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a3a6b">
  <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-brand">
        <img src="img/logo.png" alt="Logo UML" class="nav-logo">
        <div>
          <span class="brand-name">Université Méthodiste de Lubumbashi</span>
          <span class="brand-devise">Scientia, Sanctitas et Veritas</span>
        </div>
      </div>
      <a href="index.html" class="btn-retour">← Retour à l'accueil</a>
    </div>
  </nav>

  <!-- CONTENU PRINCIPAL -->
  <main class="login-main admin-login-main">
    <div class="login-box admin-box">
      <div class="tab-content active" style="padding:32px">

        <div class="admin-box-header">
          <div class="admin-box-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </div>
          <h2>Espace Administration</h2>
          <p class="form-sous-titre" style="margin-bottom:0">Réservé au personnel autorisé de l'UML</p>
        </div>

        <p id="admin-erreur" class="admin-erreur" style="display:none"></p>

        <div class="form-group">
          <label for="admin-user">Identifiant</label>
          <input type="text" id="admin-user" placeholder="Identifiant administrateur" autocomplete="username">
        </div>

        <div class="form-group">
          <label for="admin-pass">Mot de passe</label>
          <div class="input-password">
            <input type="password" id="admin-pass" placeholder="••••••••" autocomplete="current-password">
            <button type="button" class="toggle-pwd" onclick="toggleAdminPassword()" aria-label="Afficher/masquer le mot de passe">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button class="btn-submit" onclick="connexionAdmin()">Se connecter</button>

        <p class="admin-footer-note" style="text-align:center;margin-top:18px">
          <a href="index.html" style="color:inherit;text-decoration:none">← Retour au site public</a>
        </p>

      </div>
    </div>
  </main>

  <!-- TOAST -->
  <div id="toast" class="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
